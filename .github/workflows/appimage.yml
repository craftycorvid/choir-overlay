# Build the cross-distro AppImage.
#
# Only the HOST needs bundling. The two injected backends depend on nothing but libc
# and libm (ImGui is static, Vulkan goes through the layer's own dispatch, EGL/GLX
# through dlsym, and -Dstatic_backend_cxx=true removes libstdc++), so they ride along
# as plain payload and the host copies them to ~/.local on first run — neither can be
# loaded from inside the image, whose mount only exists while Choir is running.
#
# The container pins the glibc floor at 2.39 (ubuntu:24.04), covering Ubuntu 24.04+,
# Debian 13+, current Fedora, Leap 16 and SteamOS. Steam adds no separate constraint:
# pressure-vessel promotes the host's glibc into its sniper containers. Building on an
# older image is a one-line change here if that floor ever needs to drop — nothing in
# the tree needs GCC 13, and the layer's Vulkan surface is only
# VK_EXT_swapchain_colorspace plus core swapchain types.

name: AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      # Before checkout: the container is bare, and actions/checkout wants git.
      #
      # The X11/xcb/wayland/dbus set is not optional padding. Linking the host resolves
      # the transitive DT_NEEDED chain of the Qt libraries (libQt6DBus needs libdbus-1,
      # and so on), and linuxdeploy later copies those same system libraries in to make
      # the bundled platform plugins loadable. libxcb-cursor is required by the Qt 6.5+
      # xcb plugin specifically.
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config git curl ca-certificates file \
            python3-pip desktop-file-utils libfuse2t64 libvulkan-dev \
            libdbus-1-dev libglib2.0-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev \
            libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-xkb-dev

      - uses: actions/checkout@v4

      # PEP 668 marks the system Python as externally managed; this container is
      # throwaway, so install straight into it rather than standing up a venv.
      - name: Install meson + aqtinstall
        run: pip3 install --break-system-packages meson aqtinstall

      # Ubuntu 24.04 ships Qt 6.4, but src/host/ui/tray.cpp needs QStyleHints::colorScheme()
      # (6.5+) — which is also exactly why the host has to be bundled at all. Resolve the
      # latest 6.8 LTS patch rather than pinning one that may not exist.
      #
      # No `-m` modules: in Qt 6 both Qt SVG and Qt Wayland live in the base desktop
      # archive, not in Additional Libraries, and asking for them as modules is an error.
      - name: Install Qt
        run: |
          QT_VER=$(aqt list-qt linux desktop --spec "6.8" --latest-version)
          echo "Using Qt $QT_VER"
          aqt install-qt linux desktop "$QT_VER" linux_gcc_64 -O /opt/qt
          echo "QT_ROOT=/opt/qt/$QT_VER/gcc_64" >> "$GITHUB_ENV"
          echo "/opt/qt/$QT_VER/gcc_64/bin" >> "$GITHUB_PATH"

      # Assert the plugins the AppImage depends on are actually present, rather than
      # trusting that they came in the base archive. Both failures are silent at runtime
      # and only show up on a user's machine: no Wayland platform plugin means the host
      # quietly falls back to XWayland, and no SVG plugin means QIcon yields blank
      # pixmaps (the reason the host links Qt6::Svg in the first place).
      - name: Verify the Qt plugins we bundle
        run: |
          missing=0
          for p in platforms/libqwayland-generic.so platforms/libqwayland-egl.so \
                   imageformats/libqsvg.so iconengines/libqsvgicon.so; do
            if [ -f "$QT_ROOT/plugins/$p" ]; then
              echo "ok      $p"
            else
              echo "MISSING $p"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "--- available plugins ---"
            ls -1 "$QT_ROOT/plugins" "$QT_ROOT/plugins/platforms" || true
            exit 1
          fi

      # --libdir=lib is load-bearing on Debian-family distros: meson defaults libdir to
      # the multiarch lib/x86_64-linux-gnu there, which would put the payload somewhere
      # appimage_payload_dir() ($APPDIR/usr/lib/choir) never looks. Arch, where this is
      # developed, defaults to plain lib and hides the problem.
      - name: Configure and build
        run: |
          meson setup build . --buildtype=release --prefix=/usr --libdir=lib \
            -Dbuild_tests=false -Dstatic_backend_cxx=true
          meson compile -C build

      - name: Stage the AppDir
        run: |
          meson install -C build --destdir "$PWD/AppDir"

          # Both of these bake the meson prefix into their contents — an absolute
          # /usr/lib/choir library_path in the layer manifest, and the same path inside
          # choir-run. Neither is right for an AppImage, and the host regenerates both
          # against ~/.local when it installs the payload (src/host/config/backends.cpp).
          # The .so files under AppDir/usr/lib/choir stay: they ARE the payload.
          rm -rf AppDir/usr/share/vulkan
          rm -f AppDir/usr/bin/choir-run

          # The imgui wrap installs its build-time static lib; useless at runtime and
          # 2.6 MB of it. Both PKGBUILDs drop it for the same reason.
          rm -f AppDir/usr/lib/libimgui.a

          # Must match appimage_payload_dir() exactly, or the host finds no payload.
          test -f AppDir/usr/lib/choir/libchoir_overlay.so
          test -f AppDir/usr/lib/choir/libchoir_gl.so

          # linuxdeploy-plugin-qt does not deploy these, but src/host/ui/icons.cpp builds
          # every icon with QIcon(":/…svg") — the path form, which resolves through the SVG
          # ICON ENGINE, not the imageformats plugin the Qt plugin does bundle. Without it
          # the app and tray icons are silently blank, exactly the failure CLAUDE.md warns
          # about. Pre-placing them means linuxdeploy treats them as AppDir content and
          # patches their rpath with everything else (it already does this to our payload).
          for d in iconengines wayland-graphics-integration-client; do
            if [ -d "$QT_ROOT/plugins/$d" ]; then
              mkdir -p "AppDir/usr/plugins/$d"
              cp -v "$QT_ROOT/plugins/$d"/*.so "AppDir/usr/plugins/$d/"
            else
              echo "note: $QT_ROOT/plugins/$d not present in this Qt build"
            fi
          done

      - name: Build the AppImage
        run: |
          # No FUSE in a CI container: make every nested AppImage self-extract instead.
          export APPIMAGE_EXTRACT_AND_RUN=1

          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          # Version from meson.build, the same source of truth the PKGBUILDs track, so
          # this works for a manual workflow_dispatch run as well as a tag push.
          VERSION=$(meson introspect build --projectinfo \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          export VERSION

          export QMAKE="$QT_ROOT/bin/qmake6"
          export LD_LIBRARY_PATH="$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"

          # Wayland is the target and only tested session, and linuxdeploy-plugin-qt
          # bundles only the xcb platform plugin unless told otherwise — without these
          # the host falls back to XWayland. (The SVG icon engine is NOT deployable this
          # way; it is copied into the AppDir during staging instead.)
          export EXTRA_PLATFORM_PLUGINS="libqwayland-generic.so;libqwayland-egl.so"
          export EXTRA_QT_PLUGINS="wayland-decoration-client;wayland-shell-integration"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/choir.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/choir.svg \
            --plugin qt \
            --output appimage

          ls -la ./*.AppImage

      # linuxdeploy walks the AppDir and patchelfs what it finds, so confirm it left the
      # payload usable: still where appimage_payload_dir() looks, still depending on
      # nothing but the C runtime, and still exporting only the three Vulkan loader
      # entrypoints the version script allows.
      #
      # The payload is dlopened into arbitrary games, so a dependency on a bundled Qt
      # library would be unresolvable there — that is what this guards against.
      # ld-linux is not such a dependency: -static-libstdc++ emits that NEEDED entry in
      # a plain local build too, and the interpreter is mapped into every process
      # regardless. linuxdeploy also stamps RUNPATH=$ORIGIN, which is inert here (the
      # only deps resolve from the system paths) and goes stale once the host copies the
      # library to ~/.local anyway.
      - name: Verify the payload survived bundling
        run: |
          for lib in libchoir_overlay.so libchoir_gl.so; do
            path="AppDir/usr/lib/choir/$lib"
            test -f "$path" || { echo "payload missing: $path"; ls -R AppDir/usr/lib | head -40; exit 1; }
            echo "--- $lib ---"
            readelf -d "$path" | grep -E 'NEEDED|RUNPATH|RPATH' || true
            if readelf -d "$path" | grep NEEDED \
                 | grep -qvE 'libc\.so|libm\.so|ld-linux-x86-64\.so'; then
              echo "unexpected dependency in $lib — a bundled library would not resolve inside a game"
              exit 1
            fi
          done
          exports=$(nm -D --defined-only AppDir/usr/lib/choir/libchoir_overlay.so \
                    | grep -c ' T ' || true)
          echo "layer exports: $exports"
          test "$exports" -eq 3

          # What actually ended up bundled, as opposed to what we asked for. Every one of
          # these fails silently on a user's machine: no Wayland plugin and the host drops
          # to XWayland, no SVG icon engine and every icon is blank.
          missing=0
          for p in platforms/libqwayland-generic.so platforms/libqwayland-egl.so \
                   platforms/libqxcb.so imageformats/libqsvg.so \
                   iconengines/libqsvgicon.so; do
            if [ -f "AppDir/usr/plugins/$p" ]; then
              echo "ok      $p"
            else
              echo "MISSING $p"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "--- bundled plugins ---"
            find AppDir/usr/plugins -name '*.so' | sort
            exit 1
          fi

      # Narrowly Choir-*: a bare *.AppImage glob also matches the downloaded linuxdeploy
      # tools, which would otherwise get attached to the GitHub release.
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: ./Choir-*-x86_64.AppImage
          if-no-files-found: error

  # Separate job on the runner itself (not the container) so the preinstalled gh CLI is
  # available — the same `gh release` flow the release notes in CLAUDE.md describe.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage

      # Tolerates either order: the release may already exist from a manual
      # `gh release create`, or this may be the first thing to make it. --clobber keeps
      # re-runs idempotent, like packaging/aur/publish.sh.
      - name: Attach the AppImage to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ./Choir-*-x86_64.AppImage --clobber
